name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microService
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: microService/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests (fast set — no real network calls, no downloaded models)
        run: ./run_tests.sh -m "not slow and not e2e"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Only need to satisfy build-time validation (lib/auth.ts fails fast
      # otherwise) — no real backend or database is reachable in this job.
      JWT_SECRET: ci-only-placeholder-secret-not-a-real-credential
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
