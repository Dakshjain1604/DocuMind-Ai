[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers

# The suite is layered by directory; select a layer with -m, e.g.
#   ./run_tests.sh -m "not e2e"
markers =
    e2e: end-to-end, needs a real embedding model (opt in with RAG_RUN_E2E=1)
    slow: downloads or runs a model; skipped when it is not cached locally
